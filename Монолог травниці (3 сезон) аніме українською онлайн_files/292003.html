            function AshdiNormalizeVastId(value) {

            function AshdiParseVastInfo(info) {
                if (!info || typeof info !== 'string') {
                    return null;
                }

                try {
                    return JSON.parse(info);

                return null;

            function AshdiVastAdTypeFromString(value) {
                value = (value === undefined || value === null) ? '' : String(value).toLowerCase();

                if (value.indexOf('midroll') !== -1) {
                    return 'midroll';
                }

                if (value.indexOf('preroll') !== -1) {
                    return 'preroll';
                }

                if (value.indexOf('postroll') !== -1) {
                    return 'postroll';
                }

                return '';
            }

            function AshdiUrlHost(value) {
                value = (value === undefined || value === null) ? '' : String(value).trim();

                if (value === '') {
                    return '';
                }

                try {
                    return (new URL(value, document.location.href)).host || '';
                } catch(e) {}

                var match = value.match(/^https?:\/\/([^\/?#]+)/i);
                return match ? match[1] : '';
            }

            function AshdiVastIdFromInfo(infoObj) {
                if (!infoObj || !infoObj.id) {
                    return '';
                }

                var rawAdId = String(infoObj.id).trim();
                var parts = rawAdId.split('->');

                if (parts.length > 1) {
                    return (parts[0] || '').trim();
                }

                if (/^(pre|mid|post|pause)roll_\d+/i.test(rawAdId)) {
                    return '';
                }

                if (rawAdId === 'null') {
                    return '';
                }

                return rawAdId;
            }

            function AshdiRememberVastLoad(info) {
                var adType = AshdiVastAdTypeFromString(info);

                if (!adType) {
                    return;
                }

                ashdi_vast_context = {
                    ad_type: adType,
                    error_text: 'load:' + String(info)
                };
            }

            function AshdiRememberVastUrl(info, type) {
                var value = (info === undefined || info === null) ? '' : String(info).trim();

                if (value === '') {
                    return;
                }

                if (!ashdi_vast_context || typeof ashdi_vast_context !== 'object') {
                    ashdi_vast_context = {};
                }

                var host = AshdiUrlHost(value);
                var key = type === 'wrapper' ? 'wrapper_url' : 'vast_url';
                var hostKey = type === 'wrapper' ? 'wrapper_host' : 'vast_url_host';

                ashdi_vast_context[key] = value;
                ashdi_vast_context[hostKey] = host;

                if (!ashdi_vast_context.error_text) {
                    ashdi_vast_context.error_text = type + ':' + value;
                }
            }

            function AshdiRememberVastContext(info) {
                var infoObj = AshdiParseVastInfo(info);

                if (!infoObj) {
                    return;
                }

                var adType = infoObj.is || '';
                var vastId = AshdiVastIdFromInfo(infoObj);

                ashdi_vast_context = {
                    ad_type: adType,
                    vast_id: vastId,
                    ad_system: infoObj.system || '',
                    vast_url: infoObj.url || ashdi_vast_context.vast_url || '',
                    vast_url_host: AshdiUrlHost(infoObj.url || ashdi_vast_context.vast_url || ''),
                    wrapper_url: ashdi_vast_context.wrapper_url || '',
                    wrapper_host: ashdi_vast_context.wrapper_host || '',
                    error_code: ashdi_vast_context.error_code || '',
                    error_text: info || ''
                };
            }

            function AshdiRememberVastErrorCode(info) {
                if (info !== undefined && info !== null && String(info).trim() !== '') {
                    ashdi_vast_context.error_code = String(info).trim();
                }
            }

            function AshdiSendVastError(info) {
                if (ashdi_vast_error_count >= 20) {
                    return;
                }

                var adType = ashdi_vast_context.ad_type || (typeof info === 'string' ? info : '') || 'unknown';
                var vastId = ashdi_vast_context.vast_id || '';
                var sourceHost = ashdi_vast_context.wrapper_host || ashdi_vast_context.vast_url_host || '';
                var adSystem = ashdi_vast_context.ad_system || (sourceHost ? ('host:' + sourceHost).substring(0, 80) : '');
                var adMeta = AshdiResolveAdMeta(adType, 0, vastId);
                var errorCode = ashdi_vast_context.error_code || '';
                var key = [adType, vastId, adSystem, errorCode, adMeta.slot, ashdi_vast_context.vast_url || '', ashdi_vast_context.wrapper_url || ''].join('|');

                if (ashdi_vast_error_seen[key]) {
                    return;
                }

                ashdi_vast_error_seen[key] = true;
                ashdi_vast_error_count++;

                AshdiStatsSend('vast_error', {
                    ad_type: adType || 'unknown',
                    slot: adMeta.slot,
                    campaign_id: adMeta.campaign_id,
                    campaign_name: adMeta.campaign_name,
                    partner_name: adMeta.partner_name,
                    configured_vast_id: adMeta.configured_vast_id,
                    vast_id: vastId,
                    ad_system: adSystem,

                        ashdi_vast_context.wrapper_url ? ('wrapper:' + ashdi_vast_context.wrapper_url) : ''
